final_emergency_towerlight_node:
  ros__parameters:
    # ===== Serial =====
    port: "/dev/towerlight"      # เช่น "/dev/ttyUSB0"
    baudrate: 9600
    parity: "N"                  # "N", "E", "O"
    stopbits: 1
    bytesize: 8
    timeout: 0.5                 # เพิ่มนิดให้สื่อสารนิ่งขึ้น
    slave_id: 1

    # ===== Timers =====
    poll_period: 5.0             # อ่าน holding registers ทุกกี่วิ
    reconnect_period: 2.0        # ความถี่พยายามเชื่อมต่อใหม่
    turn_green_delay: 0.0        # หลังบูตจะเปิดไฟเขียวทันที (0 = ไม่หน่วง)

    # ===== Buzzer Policy =====
    enable_buzzer: false         # ปิดระบบบัซเซอร์ทั้งหมด
    buzzer_on_red: false
    buzzer_on_yellow: false
    buzzer_on_green: false
    buzzer_on_emergency: false

    # 0 = ไม่เปิดบัซเซอร์แม้ชั่วคราว (ไม่มีเสียงติ๊ด)
    emergency_buzzer_pulse_ms: 0

    # ===== Write Behavior =====
    force_clear_before_green: true   # ปลดฉุกเฉินแล้วเคลียร์ทุกรีจิสเตอร์ก่อนเปิดเขียว
    force_block_write: true          # เขียน 0x002..0x005 ทีเดียว เร็วและนิ่ง
    force_clear_before_red: true     # ก่อนเปลี่ยนเป็นแดง เคลียร์รีจิสเตอร์ก่อน
