modbus_node:
  ros__parameters:
    # ===== Serial =====
    port: "/dev/towerlight"       # เช่น "/dev/ttyUSB0"
    baudrate: 9600                # 9600, 19200, 38400, 57600, 115200
    parity: "N"                   # "N", "E", "O"
    stopbits: 1                   # 1 หรือ 2
    bytesize: 8                   # 7 หรือ 8
    timeout: 0.5                  # วินาที
    slave_id: 1                   # Modbus slave ID ของ tower light

    # ===== Timers =====
    poll_period: 5.0              # อ่าน holding registers ทุกกี่วิ
    reconnect_period: 2.0         # ความถี่พยายามเชื่อมต่อใหม่
    turn_green_delay: 0.0         # หลังบูตจะเปิดไฟเขียวทันที (0 = ไม่หน่วง)

    # ===== Buzzer Policy =====
    enable_buzzer: True          # True=เปิด buzzer ทั้งหมด, False=ปิด buzzer ทั้งหมด
    buzzer_on_red: false      
    buzzer_on_yellow: false
    buzzer_on_green: false
    buzzer_on_emergency: false
